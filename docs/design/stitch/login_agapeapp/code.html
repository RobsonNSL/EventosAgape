<!DOCTYPE html>

<html lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "inverse-primary": "#b4c5ff", "secondary": "#006e2d", "surface-bright": "#faf8ff", "tertiary-fixed": "#ffddb8", "tertiary": "#784b00", "outline-variant": "#c3c6d7", "primary-container": "#2563eb", "background": "#faf8ff", "outline": "#737686", "on-error-container": "#93000a", "on-secondary": "#ffffff", "surface-variant": "#dae2fd", "secondary-fixed-dim": "#62df7d", "primary-fixed-dim": "#b4c5ff", "surface-container-lowest": "#ffffff", "on-primary-container": "#eeefff", "on-tertiary": "#ffffff", "inverse-surface": "#283044", "surface-tint": "#0053db", "on-secondary-container": "#007230", "surface": "#faf8ff", "on-error": "#ffffff", "secondary-fixed": "#7ffc97", "on-surface-variant": "#434655", "surface-container-high": "#e2e7ff", "surface-container-highest": "#dae2fd", "on-secondary-fixed-variant": "#005320", "surface-dim": "#d2d9f4", "primary": "#004ac6", "surface-container": "#eaedff", "primary-fixed": "#dbe1ff", "on-primary-fixed-variant": "#003ea8", "error-container": "#ffdad6", "on-primary": "#ffffff", "on-background": "#131b2e", "inverse-on-surface": "#eef0ff", "on-tertiary-container": "#ffeedd", "secondary-container": "#7cf994", "on-primary-fixed": "#00174b", "surface-container-low": "#f2f3ff", "on-secondary-fixed": "#002109", "error": "#ba1a1a", "on-tertiary-fixed-variant": "#653e00", "tertiary-container": "#996100", "on-surface": "#131b2e", "on-tertiary-fixed": "#2a1700", "tertiary-fixed-dim": "#ffb95f" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-xl": "2rem", "gutter": "1rem", "space-xs": "0.25rem", "margin": "1rem", "space-sm": "0.5rem", "space-lg": "1.5rem", "space-md": "1rem" }, fontFamily: { "body-md": ["Inter"], "body-lg": ["Inter"], "headline-sm": ["Inter"], "title-md": ["Inter"], "display-currency": ["Inter"], "label-lg": ["Inter"], "label-md": ["Inter"], "title-sm": ["Inter"], "label-sm": ["Inter"], "headline-md": ["Inter"], "headline-lg": ["Inter"] }, fontSize: { "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "title-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "display-currency": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.03em", "fontWeight": "800" }], "label-lg": ["16px", { "lineHeight": "20px", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "18px", "fontWeight": "500" }], "title-sm": ["16px", { "lineHeight": "22px", "fontWeight": "600" }], "label-sm": ["13px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }], "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-margin pb-space-lg select-none">
<!-- Top Branding Section -->
<div class="flex flex-col items-center pt-space-lg pb-space-md text-center">
<div class="relative flex items-center justify-center w-[68px] h-[68px] rounded-xl shadow-sm overflow-hidden mb-space-sm bg-primary-container">
<img alt="AgapeApp Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1XvnLud2ZXlds6nw__Xj2HljYmAlrtCjBVVOXnJLZlRq6l4htIiAAyJJv1JewwOt6eieim1EL8bAnBbNxYal4CfViCUSEdg92QtqHE-Df2UB26fos6KBuFOiXxF90S2gvqmolIl_YYlslCivNutXaYNd_1F7UFi7a59SfzE9bFhTloaqZg1f4jPtO6chk8V1NdToipJj2yDSyeoy5nfuBHkjI6ZOyPy28QgtIEAf5pLxTGpFyCU8trj"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mt-space-xs">
      AgapeApp
    </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-1">
      Cartão pré-pago dos eventos
    </p>
<!-- Quick Info Badge for Church Volunteers -->
<div class="inline-flex items-center gap-1.5 px-3 py-1 mt-space-sm rounded-full bg-surface-container text-primary font-label-sm text-label-sm">
<span class="material-symbols-outlined text-[16px]">church</span>
<span>Terminal Operacional</span>
</div>
</div>
<!-- Form Surface Card -->
<div class="w-full bg-surface-container-lowest rounded-xl shadow-sm p-space-md flex flex-col gap-space-md">
<form class="flex flex-col gap-space-md w-full" id="loginForm" onsubmit="event.preventDefault();">
<!-- Input Email Field -->
<div class="flex flex-col gap-1 w-full">
<label class="font-label-md text-label-md text-on-surface-variant" for="emailInput">
          E-mail do operador
        </label>
<div class="relative flex items-center w-full h-[56px] rounded-xl bg-surface-container-lowest shadow-sm focus-within:shadow-md transition-shadow">
<div class="absolute left-0 pl-3.5 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[22px]">mail</span>
</div>
<input autocomplete="email" class="w-full h-full pl-11 pr-4 bg-transparent rounded-xl text-on-surface font-body-lg text-body-lg placeholder:text-outline focus:outline-none" id="emailInput" name="email" placeholder="exemplo@paroquia.com.br" required="" type="email"/>
</div>
</div>
<!-- Input Password Field -->
<div class="flex flex-col gap-1 w-full">
<label class="font-label-md text-label-md text-on-surface-variant" for="passwordInput">
          Senha de acesso
        </label>
<div class="relative flex items-center w-full h-[56px] rounded-xl bg-surface-container-lowest shadow-sm focus-within:shadow-md transition-shadow">
<div class="absolute left-0 pl-3.5 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[22px]">lock</span>
</div>
<input autocomplete="current-password" class="w-full h-full pl-11 pr-12 bg-transparent rounded-xl text-on-surface font-body-lg text-body-lg placeholder:text-outline focus:outline-none" id="passwordInput" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Alternar visibilidade da senha" class="absolute right-0 pr-3.5 flex items-center justify-center text-outline hover:text-on-surface active:scale-95 transition-transform" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined text-[22px]" id="passwordEyeIcon">visibility_off</span>
</button>
</div>
</div>
<!-- Primary Action: Entrar -->
<button class="w-full h-[54px] rounded-xl bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 active:brightness-90 transition-all shadow-sm mt-1" id="submitBtn" type="submit">
<span>Entrar</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Secondary Action: Biometria -->
<button class="w-full h-[52px] rounded-xl bg-surface-container-high text-on-surface font-label-lg text-label-lg flex items-center justify-center gap-2.5 active:bg-surface-variant transition-colors" id="biometricsBtn" type="button">
<span class="material-symbols-outlined text-primary text-[22px]">fingerprint</span>
<span>Entrar com biometria</span>
</button>
</form>
<!-- Support Help & Recovery -->
<div class="pt-space-xs text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant">
        Esqueceu a senha? Procure um administrador.
      </p>
</div>
</div>
<!-- Operational Mode Quick Card -->
<div class="w-full bg-surface-container-low rounded-xl p-space-sm mt-space-md flex items-center gap-3">
<div class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center text-primary shrink-0">
<span class="material-symbols-outlined text-[22px]">contactless</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-md text-label-md text-on-surface truncate">NFC & Modo Offline Prontos</span>
<span class="font-label-sm text-label-sm text-on-surface-variant truncate">Sincronização contínua ativada</span>
</div>
<div class="ml-auto w-2.5 h-2.5 rounded-full bg-secondary shrink-0"></div>
</div>
<!-- Footer Notice -->
<div class="mt-space-lg text-center">
<p class="font-label-sm text-label-sm text-outline">
      AgapeApp v1.0.4 • Paróquia & Quermesses
    </p>
</div>
</div>
<script>
  (function () {
    const passwordInput = document.getElementById('passwordInput');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordEyeIcon = document.getElementById('passwordEyeIcon');
    const biometricsBtn = document.getElementById('biometricsBtn');
    const submitBtn = document.getElementById('submitBtn');

    if (togglePasswordBtn && passwordInput && passwordEyeIcon) {
      togglePasswordBtn.addEventListener('click', function () {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        passwordEyeIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
      });
    }

    if (biometricsBtn) {
      biometricsBtn.addEventListener('click', function () {
        const icon = biometricsBtn.querySelector('.material-symbols-outlined');
        if (icon) {
          icon.style.transform = 'scale(1.2)';
          setTimeout(() => {
            icon.style.transform = 'scale(1)';
          }, 300);
        }
      });
    }

    if (submitBtn) {
      submitBtn.addEventListener('click', function () {
        const emailInput = document.getElementById('emailInput');
        if (emailInput && !emailInput.value) {
          emailInput.focus();
        }
      });
    }
  })();
</script></main></body></html>
