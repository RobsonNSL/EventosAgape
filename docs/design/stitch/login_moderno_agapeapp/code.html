Btn" type="button"><span class="material-symbols-outlined text-blue-300 text-[20px]">fingerprint</span><span>Entrar com biometria</span></button></form><div class="text-center pt-1"><p class="text-xs text-slate-300 font-medium">Esqueceu a senha? Procure um administrador.</p></div></div><div class="w-full bg-white/10 backdrop-blur-xl border border-white/15 rounded-2xl px-4 py-3 mt-4 flex items-center gap-3 shadow-md"><div class="w-9 h-9 rounded-xl bg-blue-500/20 border border-blue-400/30 flex items-center justify-center text-blue-300 shrink-0"><span class="material-symbols-outlined text-[20px]">contactless</span></div><div class="flex flex-col min-w-0"><span class="text-xs font-semibold text-white truncate">NFC &amp; Modo Offline Prontos</span><span class="text-[11px] text-slate-300 truncate">Sincronização contínua ativada</span></div><div class="ml-auto flex items-center gap-1.5 pl-2 shrink-0"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span></div></div></div><div class="text-center pt-4 pb-1"><p class="text-xs text-slate-400 font-medium">AgapeApp v1.0.4 • Paróquia &amp; Quermesses</p></div></div><script>(function () { const passwordInput = document.getElementById('passwordInput'); const togglePasswordBtn = document.getElementById('togglePasswordBtn'); const passwordEyeIcon = document.getElementById('passwordEyeIcon'); const biometricsBtn = document.getElementById('biometricsBtn'); const submitBtn = document.getElementById('submitBtn'); if (togglePasswordBtn && passwordInput && passwordEyeIcon) { togglePasswordBtn.addEventListener('click', function () { const isPassword = passwordInput.getAttribute('type') === 'password'; passwordInput.setAttribute('type', isPassword ? 'text' : 'password'); passwordEyeIcon.textContent = isPassword ? 'visibility' : 'visibility_off'; }); } if (biometricsBtn) { biometricsBtn.addEventListener('click', function () { const icon = biometricsBtn.querySelector('.material-symbols-outlined'); if (icon) { icon.style.transform = 'scale(1.25)'; setTimeout(() => { icon.style.transform = 'scale(1)'; }, 300); } }); } if (submitBtn) { submitBtn.addEventListener('click', function () { const emailInput = document.getElementById('emailInput'); if (emailInput && !emailInput.value) { emailInput.focus(); } }); } })();</script></main></body></html>
